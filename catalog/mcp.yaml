# =============================================================================
# catalog/mcp.yaml
# -----------------------------------------------------------------------------
# Browsable reference registry of known MCP servers (managed + reference-only).
# The source of truth is manifest.yaml.
# =============================================================================
schema_version: 1
kind: mcp

entries:
  - id: exa
    name: exa
    scope: global
    managed: true
    status: managed
    transport: http
    url: https://mcp.exa.ai/mcp
    summary: Web search and current-information retrieval.
    path: ~/.agents/mcp.json

  - id: context7
    name: context7
    scope: global
    managed: true
    status: managed
    transport: http
    url: https://mcp.context7.com/mcp
    summary: Library / framework documentation lookup.
    path: ~/.agents/mcp.json

  - id: searchcode
    name: searchcode
    scope: global
    managed: true
    status: managed
    transport: http
    url: https://api.searchcode.com/v1/mcp
    summary: Search public git repositories.
    path: ~/.agents/mcp.json

  - id: codegraph
    name: codegraph
    scope: global
    managed: true
    status: managed
    capability: code-intelligence
    transport: stdio
    command: codegraph serve --mcp
    summary: Code navigation (call chains, blast radius) via the codegraph CLI.
    path: ~/.agents/mcp.json
    notes: >-
      Canonical definition lives in the tool-agnostic shared layer. Pi reads it
      directly; CodeBuddy/Qoder/OpenCode mirror it into their native config.
      Never written into a project's .pi/mcp.json unless --scope project is
      passed explicitly.