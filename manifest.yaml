schema_version: 1
toolbox:
  name: agent-toolbox
  owner: DwainYu
  # legacy field kept for compatibility; the toolbox is no longer Pi-only.
  primary_runtime: pi
  model: capability
  shared_root: ~/.agents
  description: Capability and harness-adapter registry + configuration manager
# -----------------------------------------------------------------------------
# harnesses — the adapter registry. A harness describes HOW to attach, a
# capability below describes WHAT to attach. Nothing here copies a tool.
# -----------------------------------------------------------------------------
harnesses:
  pi:
    id: pi
    name: Pi
    status: active
    config_root: ~/.pi/agent
    skill_dir: ~/.pi/agent/skills
    skill_scan_dirs:
    - ~/.pi/agent/skills
    - ~/.agents/skills
    skill_strategy: shared
    mcp_file: ~/.agents/mcp.json
    mcp_format: mcpServers
    mcp_strategy: shared
    installer_ids:
      bsk: Pi
      skills: pi
  codebuddy:
    id: codebuddy
    name: CodeBuddy
    status: active
    config_root: ~/.codebuddy
    skill_dir: ~/.codebuddy/skills
    skill_scan_dirs:
    - ~/.codebuddy/skills
    skill_strategy: symlink
    mcp_file: ~/.codebuddy/mcp.json
    mcp_format: mcpServers
    mcp_strategy: native
    installer_ids:
      bsk: CodeBuddy
      skills: codebuddy
  qoder-cn:
    id: qoder-cn
    name: Qoder CN
    status: active
    config_root: ~/.qoder-cn
    skill_dir: ~/.qoder-cn/skills
    skill_scan_dirs:
    - ~/.qoder-cn/skills
    skill_strategy: symlink
    mcp_file: ~/.qoder-cn/settings.json
    mcp_format: mcpServers
    mcp_strategy: native
    installer_ids:
      bsk: qoder-cn
      skills: qoder-cn
  opencode:
    id: opencode
    name: OpenCode
    status: active
    config_root: ~/.config/opencode
    skill_dir: ~/.config/opencode/skills
    # OpenCode also scans the tool-agnostic shared store (proved on this machine:
    # open-code-review is loadable although only ~/.agents/skills holds it).
    skill_scan_dirs:
    - ~/.config/opencode/skills
    - ~/.agents/skills
    skill_strategy: symlink
    mcp_file: ~/.config/opencode/opencode.jsonc
    mcp_format: opencode-mcp
    mcp_strategy: native
    installer_ids:
      bsk: opencode
      skills: opencode
  # --- harness lifecycle status (validate accepts all five; the matrix only
  #     contains active + verified):
  #       active               — in the support matrix, wiring verified on this machine
  #       planned              — official attach path exists; a local install is NOT
  #                              required and its absence is never an error
  #       installed-unverified — present here, but capability Level 1-4 not finished;
  #                              never promoted by a directory or `command -v` alone
  #       verified             — real smoke test passed; operationally equals active
  #       unsupported          — no usable adapter or official capability path
  #     Only `--harness <id>` explicitly touches a harness outside the matrix.
  claude-code:
    id: claude-code
    name: Claude Code
    status: planned
    config_root: ~/.claude
    skill_dir: ~/.claude/skills
    skill_scan_dirs:
    - ~/.claude/skills
    skill_strategy: installer
    mcp_file: ~/.claude.json
    mcp_format: mcpServers
    mcp_strategy: native
    installer_ids:
      bsk: claude-code
      skills: claude-code
  codex:
    id: codex
    name: Codex
    status: planned
    config_root: ~/.codex
    skill_dir: ~/.agents/skills
    skill_scan_dirs:
    - ~/.agents/skills
    skill_strategy: shared
    mcp_file: ~/.agents/mcp.json
    mcp_format: mcpServers
    mcp_strategy: shared
    installer_ids:
      bsk: codex
      skills: codex
  gemini-cli:
    id: gemini-cli
    name: Gemini CLI
    status: planned
    config_root: ~/.gemini
    skill_dir: ~/.gemini/skills
    skill_scan_dirs:
    - ~/.gemini/skills
    skill_strategy: symlink
    mcp_file: ~/.gemini/settings.json
    mcp_format: mcpServers
    mcp_strategy: native
    installer_ids:
      skills: gemini
  hermes:
    id: hermes
    name: Hermes
    # Installed on this machine (v0.21.5), but no adapter has passed the
    # capability smoke test yet. Its real MCP placement is the `mcp_servers:`
    # block inside ~/.hermes/config.yaml (YAML), not the JSON file declared
    # below — that mcp_file is a placeholder until a hermes-specific adapter
    # is developed. Do not promote to verified/active without Level 1-4.
    status: installed-unverified
    config_root: ~/.hermes
    skill_dir: ~/.hermes/skills
    skill_scan_dirs:
    - ~/.hermes/skills
    skill_strategy: symlink
    mcp_file: ~/.hermes/mcp.json
    mcp_format: mcpServers
    mcp_strategy: native
    installer_ids:
      bsk: hermes
      skills: hermes
  cursor:
    id: cursor
    name: Cursor
    status: planned
    config_root: ~/.cursor
    skill_dir: ~/.cursor/skills
    skill_scan_dirs:
    - ~/.cursor/skills
    skill_strategy: installer
    mcp_file: ~/.cursor/mcp.json
    mcp_format: mcpServers
    mcp_strategy: native
    installer_ids:
      bsk: cursor
      skills: cursor
# -----------------------------------------------------------------------------
# capabilities — the capability registry (capability first).
# A capability owns a CLI and/or an MCP server; its skills are only adapters
# that teach a harness how to reach that CLI/MCP. Sources and versions stay in
# `resources` below (single source of truth) -- capabilities reference them by
# id and never duplicate upstream information.
# -----------------------------------------------------------------------------
capabilities:
  browser:
    id: browser
    name: BrowserSkill
    provider: Tencent
    description: Drive the user's logged-in Chromium browser through the bsk CLI
      and a browser extension.
    cli:
      resource: bsk
      command: bsk
      required: true
      updater:
        command: bsk
        args:
        - update
    skills:
    - resource: browser-skill
      shared_path: ~/.agents/skills/browser-skill
    installer:
      id: bsk
      command: bsk
      args:
      - install-skill
      - --harness
      - '{id}'
      - -y
    harnesses:
      pi:
        skill_strategy: shared
      codebuddy:
        skill_strategy: installer
      qoder-cn:
        skill_strategy: symlink
      opencode:
        skill_strategy: symlink
  code-review:
    id: code-review
    name: OpenCodeReview
    provider: alibaba
    description: AI-powered line-level code review on git changes through the ocr
      CLI, plus its two host-agent skills.
    cli:
      resource: ocr
      command: ocr
      required: true
      updater:
        command: npm
        args:
        - install
        - -g
        - '@alibaba-group/open-code-review'
    skills:
    - resource: open-code-review
      shared_path: ~/.agents/skills/open-code-review
    - resource: open-code-review-delegate
      shared_path: ~/.agents/skills/open-code-review-delegate
    installer:
      id: skills
      command: npx
      args:
      - skills
      - add
      - alibaba/open-code-review
      - --skill
      - '*'
      - --global
      - --agent
      - '{id}'
      - --yes
    harnesses:
      pi:
        skill_strategy: shared
      codebuddy:
        skill_strategy: installer
      qoder-cn:
        skill_strategy: installer
      opencode:
        skill_strategy: installer
  code-intelligence:
    id: code-intelligence
    name: CodeGraph
    provider: codegraph
    description: Code navigation (call chains, blast radius, related symbols) as a
      CLI plus a stdio MCP server.
    cli:
      resource: codegraph-cli
      command: codegraph
      required: true
      updater:
        command: codegraph
        args:
        - upgrade
    mcp:
      enabled: true
      server_name: codegraph
      transport: stdio
      definition: shared
      reindex_check: true
    harnesses:
      pi:
        mcp_strategy: shared
      codebuddy:
        mcp_strategy: native
      qoder-cn:
        mcp_strategy: native
      opencode:
        mcp_strategy: native
  # --- MCP-only capabilities hosted by third parties. Their canonical
  #     definitions live in the tool-agnostic shared layer
  #     (profiles/shared/mcp.json -> ~/.agents/mcp.json), the single MCP
  #     source of truth; Pi reads it directly, the others mirror it natively.
  exa:
    id: exa
    name: Exa
    provider: exa
    description: Web search / current information via the hosted Exa MCP endpoint.
    mcp:
      enabled: true
      server_name: exa
      transport: http
      definition: shared
    harnesses:
      pi:
        mcp_strategy: shared
      codebuddy:
        mcp_strategy: native
      qoder-cn:
        mcp_strategy: native
      opencode:
        mcp_strategy: native
  context7:
    id: context7
    name: Context7
    provider: context7
    description: Library / framework documentation via the hosted Context7 MCP.
    mcp:
      enabled: true
      server_name: context7
      transport: http
      definition: shared
    harnesses:
      pi:
        mcp_strategy: shared
      codebuddy:
        mcp_strategy: native
      qoder-cn:
        mcp_strategy: native
      opencode:
        mcp_strategy: native
  searchcode:
    id: searchcode
    name: Searchcode
    provider: searchcode
    description: Search public git repositories via the hosted searchcode MCP.
    mcp:
      enabled: true
      server_name: searchcode
      transport: http
      definition: shared
    harnesses:
      pi:
        mcp_strategy: shared
      codebuddy:
        mcp_strategy: native
      qoder-cn:
        mcp_strategy: native
      opencode:
        mcp_strategy: native
# -----------------------------------------------------------------------------
# resources — single source of truth for sources and versions.
# `clis` is the new group for capability CLIs (kind: cli).
# -----------------------------------------------------------------------------
resources:
  clis:
  - id: bsk
    name: bsk
    kind: cli
    scope: global
    description: BrowserSkill CLI (capability body for the `browser` capability).
    source:
      type: manual
      url: ''
      ref: ''
    resolution:
      version: 0.3.0
      commit: ''
      checked_at: '2026-10-04'
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    install:
      method: official-cli
      path: ~/.local/bin/bsk
    tags:
    - cli
    - browser
    notes: Self-updating binary (`bsk update`). The toolbox probes `bsk --version`
      live and never installs or re-downloads it.
  - id: ocr
    name: ocr
    kind: cli
    scope: global
    description: OpenCodeReview CLI (capability body for `code-review`).
    source:
      type: npm
      package: '@alibaba-group/open-code-review'
      ref: 1.12.12
    resolution:
      version: '1.12.12'
      commit: ''
      checked_at: '2026-10-05'
    update:
      policy: weekly
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    install:
      method: official-cli
      path: ~/.hermes/node/bin/ocr
    tags:
    - cli
    - code-review
    notes: npm package, weekly upstream check. Never installed into any harness
      directory -- the CLI lives on PATH once.
  - id: codegraph-cli
    name: codegraph
    kind: cli
    scope: global
    description: CodeGraph CLI (capability body for `code-intelligence`; also serves
      the MCP server).
    source:
      type: npm
      package: '@colbymchenry/codegraph'
      ref: 1.6.2
    resolution:
      version: 1.6.2
      commit: ''
      checked_at: '2026-10-06'
    update:
      policy: weekly
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    install:
      method: official-cli
      path: ~/.hermes/node/bin/codegraph
    tags:
    - cli
    - codegraph
    notes: One binary provides both the CLI and the stdio MCP server
      (`codegraph serve --mcp`). Index freshness is separate from CLI upgrades --
      see docs/lifecycle.md.
  skills:
  - id: browser-skill
    name: browser-skill
    kind: skill
    scope: global
    description: Automate the user's logged-in Chromium browser (visit/read/fill/scrape/
      click/regression-test) via the `bsk` CLI and a browser extension.
    source:
      type: manual
      url: ''
      ref: ''
    resolution:
      version: bundled
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: false
      review_required: true
    install:
      method: official-installer
      path: ~/.agents/skills/browser-skill
    tags:
    - browser
    - bsk
    - automation
    notes: Single shared copy in ~/.agents/skills/ (tool-agnostic). Installed and
      updated by the official installer (`bsk install-skill`), never by this toolbox.
      Harnesses attach via symlink or by scanning the shared dir -- see
      capabilities.browser.harnesses.
  - id: open-code-review
    name: open-code-review
    kind: skill
    scope: global
    description: AI-powered code review on Git changes via the `ocr` CLI from alibaba/open-code-review.
      Produces line-level review comments.
    source:
      type: github
      url: https://github.com/alibaba/open-code-review
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: false
      review_required: true
    install:
      method: official-installer
      path: ~/.agents/skills/open-code-review
    tags:
    - code-review
    - ocr
    - grpc
    notes: Shared adapter only; teaches a harness to call the `ocr` CLI. Installed
      by `npx skills add alibaba/open-code-review --global` (adapter update), while
      the CLI itself upgrades via npm (tool update) -- see docs/lifecycle.md.
  - id: open-code-review-delegate
    name: open-code-review-delegate
    kind: skill
    scope: global
    description: Delegation mode for open-code-review where the host agent performs
      the review itself, using ocr only for file selection / rule resolution.
    source:
      type: github
      url: https://github.com/alibaba/open-code-review
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: false
      review_required: true
    install:
      method: official-installer
      path: ~/.agents/skills/open-code-review-delegate
    tags:
    - code-review
    - delegate
    notes: Shared adapter of the same family as open-code-review; installed by the
      same official `npx skills add` call. Keep the two skills in sync -- they ship
      from one upstream repo.
  - id: orca-cli
    name: orca-cli
    kind: skill
    scope: global
    description: Operate Orca-managed worktrees, terminals, repos, automations, artifacts
      and Orca's embedded browser through the `orca` CLI.
    source:
      type: github
      url: https://github.com/stablyai/orca
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: false
      review_required: true
    install:
      method: orca-managed
      path: ~/.pi/agent/skills/orca-cli
    tags:
    - orca
    - worktree
    - cli
    notes: 'Installed by the Orca CLI (source: stablyai/orca, skillPath skills/orca-cli/SKILL.md,
      skillFolderHash 572f7952...). The `orca` binary is the updater -> manual policy
      for the toolbox.'
  - id: orchestration
    name: orchestration
    kind: skill
    scope: global
    description: 'Coordinate supervised Orca workers: threaded messages, task DAGs,
      decision gates, coordinator loops, and decomposing work across agents.'
    source:
      type: github
      url: https://github.com/stablyai/orca
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: false
      review_required: true
    install:
      method: orca-managed
      path: ~/.pi/agent/skills/orchestration
    tags:
    - orca
    - orchestration
    - supervisor
    notes: 'Installed by the Orca CLI (source: stablyai/orca, skillPath skills/orchestration/SKILL.md,
      skillFolderHash b0cd1d58...).'
  mcp:
  - id: exa
    name: exa
    kind: mcp
    scope: global
    description: Web search / current information via the hosted Exa MCP endpoint.
    source:
      type: url
      url: https://mcp.exa.ai/mcp
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    runtime:
      transport: http
      url: https://mcp.exa.ai/mcp
    install:
      method: shared-mcp
      path: ~/.agents/mcp.json
    tags:
    - mcp
    - search
    - exa
    notes: Hosted (URL) MCP endpoint. Version is managed by the provider; there is
      no local ref to diff, so updates are reported only on command/url/args change.
      Does not require a secret in this config. Canonical definition lives in the
      shared layer (~/.agents/mcp.json); harnesses mirror it natively.
  - id: context7
    name: context7
    kind: mcp
    scope: global
    description: Library / framework documentation MCP via the hosted Context7 endpoint.
    source:
      type: url
      url: https://mcp.context7.com/mcp
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    runtime:
      transport: http
      url: https://mcp.context7.com/mcp
    install:
      method: shared-mcp
      path: ~/.agents/mcp.json
    tags:
    - mcp
    - docs
    - context7
    notes: Hosted URL endpoint; no local ref to diff. Canonical definition lives
      in the shared layer (~/.agents/mcp.json).
  - id: searchcode
    name: searchcode
    kind: mcp
    scope: global
    description: Search / analyze public git repositories via the hosted searchcode
      MCP.
    source:
      type: url
      url: https://api.searchcode.com/v1/mcp
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: 2026-10-02
    update:
      policy: manual
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    runtime:
      transport: http
      url: https://api.searchcode.com/v1/mcp
    install:
      method: shared-mcp
      path: ~/.agents/mcp.json
    tags:
    - mcp
    - search
    - code
    notes: Hosted URL endpoint; no local ref to diff. Canonical definition lives
      in the shared layer (~/.agents/mcp.json).
  - id: codegraph
    name: codegraph
    kind: mcp
    scope: global
    description: Code navigation MCP (call chains, blast radius, related symbols)
      served over stdio by the `codegraph` CLI.
    source:
      # The MCP server IS the `codegraph` binary. Upstream version tracking for
      # it is owned by the `codegraph-cli` resource (one tool, one source of
      # truth) -- this entry only declares the MCP wiring, so it is never probed
      # independently.
      type: manual
      url: ''
      ref: ''
    resolution:
      version: ''
      commit: ''
      checked_at: '2026-10-04'
    update:
      policy: pin
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    runtime:
      transport: stdio
      command: codegraph
      args:
      - serve
      - --mcp
    install:
      method: shared-mcp
      path: ~/.agents/mcp.json
    tags:
    - mcp
    - codegraph
    - stdio
    notes: Canonical definition lives in the tool-agnostic shared layer
      (~/.agents/mcp.json, repo side profiles/shared/mcp.json). Pi reads it
      directly; CodeBuddy/Qoder/OpenCode mirror it into their native config.
      NEVER written into per-project .pi/mcp.json -- project-local MCP is an
