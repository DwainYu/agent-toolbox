  packages:
  - id: pi-web-access
    name: pi-web-access
    kind: package
    scope: global
    description: Pi package providing web access capabilities.
    source:
      type: npm
      package: pi-web-access
      ref: 0.35.0
    resolution:
      version: 0.35.0
      commit: ''
      checked_at: '2026-10-02'
    update:
      policy: weekly
      channel: stable
    security:
      trust: review
      executable: true
      review_required: true
    install:
      method: pi-install
