profiles:
  global:
    path: ~/.pi/agent
    config:
      settings: profiles/global/settings.json
      mcp: profiles/global/mcp.json
      skills: ~/.pi/agent/skills
      extensions: ~/.pi/agent/extensions
  projects:
    agent-engineering-lab:
      repo: DwainYu/agent-engineering-lab
      path: ~/projects/agent-engineering-lab
      config:
        settings: profiles/projects/agent-engineering-lab/settings.json
        mcp: profiles/projects/agent-engineering-lab/mcp.json
    tft-training-log:
      repo: DwainYu/tft-training-log
      path: ~/projects/tft-training-log
      config:
        settings: profiles/projects/tft-training-log/settings.json
        mcp: profiles/projects/tft-training-log/mcp.json
    hengguang-ai-platform-demo:
      repo: DwainYu/hengguang-ai-platform-demo
      path: ~/projects/hengguang-ai-platform-demo
      config:
        settings: profiles/projects/hengguang-ai-platform-demo/settings.json
        mcp: profiles/projects/hengguang-ai-platform-demo/mcp.json
    md-content-publisher:
