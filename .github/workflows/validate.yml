name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Bootstrap (informative — CI runner lacks pi/npm)
        run: |
          bash scripts/bootstrap.sh || echo "::warning::bootstrap reported missing prereqs (expected on CI: pi, npm registry config). Repo validity is checked below regardless."
        shell: bash

      - name: Validate manifest / lock / profiles / secrets
        run: bash scripts/validate.sh --json

      - name: Check manifest <-> lock sync
        run: bash scripts/sync.sh

      - name: Run test suite (isolated copy)
        run: bash tests/run-tests.sh
        shell: bash