name: check-updates

on:
  schedule:
    # weekly, Sunday 03:00 UTC — enough for our update policies (see docs/update-policy.md)
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Probe upstream (npm, git — never installs anything locally)
        id: probe
        run: |
          bash scripts/check-updates.sh --json > update-check.json
          echo "count=$(jq '.count' update-check.json)" >> "$GITHUB_OUTPUT"
          jq -c '.' update-check.json > /dev/null
        shell: bash

      - name: No updates — stop
        if: steps.probe.outputs.count == '0'
        run: echo "No upstream updates found. Nothing to do." && exit 0

      - name: Apply resolution into manifest + lock + report
        if: steps.probe.outputs.count != '0'
        run: bash scripts/check-updates.sh --apply
        shell: bash

      - name: Render PR body
        id: body
        if: steps.probe.outputs.count != '0'
        run: |
          BODY=$(jq -r '
            "# 🤖 Update PR\n\nGenerated by `.github/workflows/check-updates.yml` (weekly probe).\n\n## Changes\n\n" +
            ([.updates[] | "**\(.id)** — \(.current) → **\(.latest)**  \n   source: \(.source) | kind: \(.kind) | scope: \(.scope)"]
              | map("- " + .) | join("\n")) +
            "\n\n## Review notes\n\n" +
            if any(.updates[]; .security_review_required) then
              "⚠️ Resources flagged `security_review_required` need a manual security review before merge (executables / new MCP endpoints)."
            else
              "No resources flagged as security-sensitive."
            end
            ' update-check.json)
          printf '%s' "$BODY" > pr-body.md
        shell: bash

      - name: Create update PR
        if: steps.probe.outputs.count != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply upstream updates from weekly check"
          title: "🤖 Update resources ({{ steps.probe.outputs.count }} available)"
          body-path: pr-body.md
          branch: auto/update-resources
          base: main
          delete-branch: true
          labels: updates